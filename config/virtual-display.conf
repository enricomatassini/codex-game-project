Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "DontVTSwitch" "true"
EndSection
Section "Device"
    Identifier "DummyVideo"
    Driver "dummy"
    VideoRam 192000
EndSection
Section "Monitor"
    Identifier "DummyMonitor"
    HorizSync 5.0-1000.0
    VertRefresh 5.0-200.0
    Modeline "1080x1920" 173.0 1080 1208 1320 1560 1920 1923 1933 1965
EndSection
Section "Screen"
    Identifier "DummyScreen"
    Device "DummyVideo"
    Monitor "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1080x1920"
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "DummyLayout"
    Screen "DummyScreen"
EndSection
